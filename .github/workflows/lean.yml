name: Lean 4 · Type-Check & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build (Lean ${{ matrix.lean }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        lean:
          - "v4.15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set auto-config to false to intercept the missing lake-manifest.json crash
      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      # Generates the lockfile dynamically inside the cloud container
      - name: Generate Lake Manifest
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update

      # Downloads pre-built binaries to drop build time from 1h to 5min
      - name: Fetch Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
        continue-on-error: true

      - name: Build ComplexitySeparation
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      # Gatekeeper step to enforce complete proofs before merging
      - name: Check for sorry-free proofs
        run: |
          if grep -rn "sorry" ComplexitySeparation/ ComplexitySeparation.lean; then
            echo "::error::Found 'sorry' in source files — all proofs must be complete."
            exit 1
          fi
          echo "✅ No sorry found — all proofs are complete."

      - name: Post build summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lean toolchain | \`$(cat lean-toolchain)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"