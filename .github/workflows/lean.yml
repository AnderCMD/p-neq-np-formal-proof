name: Lean 4 · Type-Check & Build

# ──────────────────────────────────────────────────────────────────────────────
# Trigger on every push (all branches) and every pull-request targeting main.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref so a rapid series of pushes only
# consumes one runner slot at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build (Lean ${{ matrix.lean }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        lean:
          # Keep this in sync with lean-toolchain.
          - "v4.15.0"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install elan (Lean version manager) ─────────────────────────────
      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          # Let lean-action read lean-toolchain automatically.
          auto-config: true
          use-github-cache: true
          use-mathlib-cache: true

      # ── 3. Restore / populate the Mathlib build cache ──────────────────────
      # `lake exe cache get` downloads pre-built .olean artefacts from the
      # Mathlib CDN, cutting the CI wall-clock time from ~1 h to ~5 min.
      - name: Fetch Mathlib cache
        run: lake exe cache get
        # A cache miss is non-fatal — Lake will rebuild from source.
        continue-on-error: true

      # ── 4. Build the project (full elaboration + type-checking) ────────────
      - name: Build ComplexitySeparation
        run: lake build

      # ── 5. Verify that no `sorry` placeholders survive in the source tree ───
      - name: Check for sorry-free proofs
        run: |
          if grep -rn "sorry" ComplexitySeparation/ ComplexitySeparation.lean; then
            echo "::error::Found 'sorry' in source files — all proofs must be complete."
            exit 1
          fi
          echo "✅ No sorry found — all proofs are complete."

      # ── 6. (Optional) Surface the Lake build log as a GitHub step summary ──
      - name: Post build summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lean toolchain | \`$(cat lean-toolchain)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
